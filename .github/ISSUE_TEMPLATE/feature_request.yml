name: Feature Request
description: Add something new to the site
labels: [feature]
body:
  - type: input
    id: title
    attributes:
      label: What do you want to build?
      placeholder: e.g. Add video upload for tutors
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      placeholder: What should it do and who is it for?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Done when...
      placeholder: |
        - [ ] Teacher can connect Google Drive
        - [ ] Upload button appears on dashboard
        - [ ] File shows in lecture list
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - A-Level
        - O-Level
        - Admin Panel
        - Auth / Login
        - Tutors
        - Other
    validations:
      required: true
